-- vim:set ft=lua:

local L4 = require("L4");

local l = L4.default_loader;
print("@MS A");
local flags = L4.Mem_alloc_flags.Continuous
              | L4.Mem_alloc_flags.Pinned
              | L4.Mem_alloc_flags.Super_pages;
local align = 21;

local io_vbus = l:new_channel();
l:start({
  caps = {
    icu = L4.Env.icu,
    sigma0 = L4.Env.sigma0,
    vbus_sd = io_vbus:svr()
  },
  log = {"io_vbus:", "blue"}
}, "rom/io rom/zynqmp2.io");
print("@MS B");


local sd_card = l:new_channel()
l:start({
  caps = {
    vbus = io_vbus,
    svr = sd_card:svr()
  },
  log = {"emmc_drv:", "green"}
  }
  , "rom/emmc-drv -v ");

print("@MS C");


print("@MS D");

l:startv(
         {
           caps = {
              ram = L4.Env.user_factory:create(L4.Proto.Dataspace,
                                              1024 * 1024 * 1024,
                                              flags, align):m("rws"),
              vbus = io_vbus,
              -- sd = sd_card --:create(0, "device=/dev/mmcblk0"):m("rw")  -- not working                           
           },
           log = L4.Env.log,
         },
         "rom/uvmm", "-v",
            "-krom/linux",
            "-drom/virt.dtb",
            "-rrom/ramdisk.cpio.gz",
            --"--client=sd:block", -- not working
            -- "-brom/sd:0:2",  -- not working Map to partition 2
            "-cconsole=ttyAMA0 earlyprintk rootwait root=/dev/ram0 rw init=/sbin/init rdinit=/sbin/init" );

print("@MS end");
