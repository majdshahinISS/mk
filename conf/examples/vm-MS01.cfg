-- vim:set ft=lua:
-- ln -s  ../../../../l4/conf/examples/vm-MS01.cfg    ../$L4Re_BUILD/bin/arm64_armv8a/l4f/vm-MS01.cfg

local L4 = require("L4")
local l = L4.default_loader

-- Memory allocation flags (ZCU104 requires these)
local flags = L4.Mem_alloc_flags.Continuous | 
              L4.Mem_alloc_flags.Pinned | 
              L4.Mem_alloc_flags.Super_pages
local align = 21  -- 2MB alignment for ZynqMP

-- Device-specific configuration
local serial_dev = "ttyPS0"  -- ZCU104 uses Cadence UART (not ttyAMA0)
local uart_base = 0xff000000 -- UART0 base address

l:startv({
    caps = {
        -- Allocate 1GB RAM for VM (adjust as needed)
        ram = L4.Env.user_factory:create(L4.Proto.Dataspace, 
                                         1024 * 1024 * 1024, 
                                         flags, align):m("rw"),
    },
    log = L4.Env.log,
}, 
-- UVMM binary and arguments
"rom/uvmm", 
"-v",               -- Verbose output
"-k", "rom/Image",  -- Linux kernel image
"-r", "rom/rootfs.cpio.gz",  -- Initramfs
"-c", "console=" .. serial_dev .. " root=/dev/ram0 rw init=/sbin/init earlycon",  -- Kernel cmdline
"-d", "rom/zcu104.dtb"  -- Device tree for guest OS
)