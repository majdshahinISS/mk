

local L4 = require("L4")
local l = L4.default_loader
print("@MS Starting VM with minimal configuration...")
l:startv({
    caps = {
        ram = L4.Env.user_factory:create(L4.Proto.Dataspace, 256 * 1024 * 1024)
    }
}, 
"rom/uvmm", "-v",
   "-k", "rom/linux",
   "-c", "console=hvc0 earlycon"
)
