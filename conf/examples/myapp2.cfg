-- $ ln -s  ../../../../l4/conf/examples/myapp2.cfg    ../$L4Re_BUILD/bin/amd64_gen/l4f/myapp2.cfg
local L4 = require 'L4'
local ld = L4.default_loader
print("Starting myapp2 : lua configuration")

--  print("XXXXXXXXXXXXXX Starting hello2 : lua configuration");
-- L4.default_loader:start({name = "hello2"}, "rom/hello");


local mem = L4.default_loader.mem
if (mem == nil) then
    print("No memory module found")
    
end
-- Create a dataspace using L4.Env.mem_alloc
local mem_alloc = L4.Env.mem_alloc
if not mem_alloc then
    print("No memory allocator found")
    return
end


if not L4.Env.mem_alloc then
    print("Memory allocator not available")
else
    print("Memory allocator available")
end


local ds = mem_alloc:create(L4.Proto.Factory, 4096)  -- Create a 4KB dataspace
if not ds then
    print("Failed to create dataspace")
    return
else
    print("Dataspace created successfully")
end
-- Start your named module
ld:start({
    -- This is where you name your module instance
    name = "myapp2",
    static_ds = ds:svr(),
    caps = {
        log = ld:new_channel():svr(),
        rm = L4.Env.rm,
        mem_alloc = L4.Env.mem_alloc,
    },
}, "rom/myapp2")  
