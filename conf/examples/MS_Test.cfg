local L4 = require("L4");
-- Some shortcut for less typing
local ld = L4.default_loader;
local platform_ctl = ld:new_channel(); -- added ok
local vbus_sd = ld:new_channel(); -- sd card
ld:start(
 {
   caps = {
     sigma0  = L4.cast(L4.Proto.Factory, L4.Env.sigma0):create(L4.Proto.Sigma0),
     icu = L4.Env.icu,
     platform_ctl = platform_ctl:svr(),
     vbus_sd = vbus_sd:svr(),
   },
   log = { "io", "blue" },
   l4re_dbg = L4.Dbg.Warn,
 }, "rom/io rom/zynqmp2.io");


local emmc = ld:new_channel();
local emmc_part1 = ld:new_channel()
ld:start({
    caps = {
        vbus = vbus_sd,  -- Correct capability
        svr = emmc:svr(),
        disk1  = emmc_part1:svr(),
    },
    log = {"emmc:", "green", "debug"}
}, "rom/emmc-drv -vvvvvv ");

print("@MS_Test: emmc-drv started");

local usb_storage = ld:new_channel()
local ahci_cl1 = L4.default_loader:new_channel();

ld:start({
  caps = {
    vbus = vbus_sd,
    svr = usb_storage:svr(),
    cl1 = ahci_cl1:svr(),
  },
  log = {"usb_drv:", "red", "debug"}
}, "rom/ahci-drv -vvvvvv --client cl1 --device F0B8-7ADD -vvvvvv");  -- Replace emmc-drv with USB driver

local fs_cap = L4.default_loader:new_channel()
local fs_task = L4.default_loader:start({ 
    caps = { 
            block = ahci_cl1:svr(), 
            -- emmc = emmc:svr(), 
            -- disk1 = emmc_part1:svr(),
              -- fs = fs_cap:svr()
            }, 
    log = L4.Env.log 
}, "rom/fs")
print(fs_task:state());
print("@MS_Test: Ending MS_Test.cfg");