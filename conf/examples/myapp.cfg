-- vim:ft=lua
-- this is a configuration to start 'myapp'
local L4 = require("L4");
local l = L4.default_loader;
 
cmd = l:new_channel()
 
l:start({ log = L4.Env.log, caps = { svr = cmd:svr()} }, "rom/ned-prompt")
 
L4.server_loop(cmd)

